<style>
        :root {
            --joint-color: #0f7a47;
            --topbar-seam-light: #63bb86;
            --sidebar-bottom-light: #4db37b;
        }

        /* 全局基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", SimSun, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* 头部导航 */
        .header {
            color: #ffffff;
            height: 60px;
            line-height: 60px;
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .nav-list {
            display: flex;
            gap: 35px;
        }

        .nav-item {
            cursor: pointer;
            font-size: 15px;
        }

        .nav-item a {
            color: inherit;
            text-decoration: none;
        }

        .nav-item:hover {
            text-decoration: underline;
        }

        /* 主体内容布局 */
        .main {
            flex: 1 0 auto;
            display: flex;
            gap: 30px;
            margin: 30px auto;
            width: 100%;
        }

        .left-box {
            flex: 840 0 0;
            min-width: 0;
        }

        .right-box {
            flex: 330 0 0;
            min-width: 0;
        }

        /* 页面宽度短于 850px 时改为上下排列 */
        @media (max-width: 849px) {
            .main {
                flex-direction: column;
            }

            .left-box,
            .right-box {
                flex: 0 0 auto;
                width: 100%;
            }
        }

        /* 标题栏 */
        .title-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 17px;
            font-weight: 600;
            color: #222;
        }

        .more {
            font-size: 14px;
            cursor: pointer;
        }

        /* 通知列表 */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .news-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            line-height: 1.5;
            font-size: 15px;
            border-bottom: 1px dashed var(--surface-border, #E5E7EB);
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .news-title {
            flex: 1;
            color: #333;
            cursor: pointer;
        }

        .news-date {
            color: #888;
            font-size: 13px;
            flex-shrink: 0;
        }

        /* 页脚 */
        .footer {
            margin-top: auto;
            padding: 16px 0;
        }

        /* 趣味功能区（选项卡） */
        .fun-section {
            margin-top: 24px;
        }

        .fun-tabs {
            display: flex;
            gap: 8px;
            position: relative;
        }

        .fun-tab {
            flex: 1;
            position: relative;
            padding: 10px 4px;
            border: 1px solid var(--surface-border, #E5E7EB);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            background: #f5f6f7;
            color: var(--text-secondary, #666);
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
            user-select: none;
        }

        .fun-tab:hover {
            background: #e8f8ef;
        }

        .fun-tab.active {
            background: #ffffff;
            color: var(--joint-color);
            font-weight: bold;
        }

        /* 选中按钮的绿色发光阴影层（从下往上生长） */
        .fun-tab::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 0;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 0 10px 2px rgba(15, 122, 71, 0.45);
            pointer-events: none;
            transition: height 0.28s ease;
        }

        .fun-tab.shadow-on::after {
            height: 100%;
        }

        /* 沿内容区上边缘滑动的绿色光影 */
        .fun-shadow-runner {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--joint-color);
            box-shadow: 0 0 8px 2px rgba(15, 122, 71, 0.6);
            border-radius: 2px;
            opacity: 0;
            pointer-events: none;
            transition: left 0.28s ease, width 0.28s ease, opacity 0.15s ease;
        }

        .fun-panel {
            display: none;
            background: #ffffff;
            border: 1px solid var(--surface-border, #E5E7EB);
            border-radius: 0 0 8px 8px;
            padding: 20px 16px;
            min-height: 160px;
            font-size: 14px;
            color: var(--text-secondary, #666);
            line-height: 1.8;
        }

        .fun-panel.active {
            display: block;
            animation: fun-panel-in 0.3s ease;
        }

        /* 内容区切换时的淡入 + 轻微上浮过渡 */
        @keyframes fun-panel-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 窝囊费打表日历 */
        .fee-cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .fee-cal-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--text-primary, #222);
        }

        .fee-cal-nav {
            width: 28px;
            height: 28px;
            border: 1px solid var(--surface-border, #E5E7EB);
            border-radius: 6px;
            background: #ffffff;
            color: var(--joint-color);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .fee-cal-nav:hover {
            background: #e8f8ef;
        }

        .fee-cal-week,
        .fee-cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .fee-cal-week {
            margin-bottom: 4px;
        }

        .fee-cal-week span {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted, #888);
            line-height: 24px;
        }

        .fee-cal-grid span {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-primary, #222);
        }

        /* JSON 中指定日期的高亮样式 */
        .fee-day-highlight {
            background: var(--joint-color);
            color: #ffffff !important;
            font-weight: bold;
        }
    </style>
